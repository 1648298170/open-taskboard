# Taskboard Web + Fastify API in one container, exposed on host port 47824.
# Admin account is initialized in the browser on first visit; no TASKBOARD_TOKEN needed.
# Persistent credentials and board data live in the taskboard-data volume.
services:
  taskboard:
    build:
      context: .
      args:
        # 本机网络拉 docker.io 不稳定 — 经 1ms 镜像源取 node:22-slim
        NODE_IMAGE: docker.1ms.run/library/node:22-slim
    image: open-taskboard:latest
    container_name: open-taskboard
    environment:
      # New-project dialog no longer asks for a server URL; default to the host.
      TASKBOARD_OPENCODE_URL: http://host.docker.internal:4096
      # Browser-facing origin used only to build OpenCode Session links; set to an address reachable by users' browsers.
      TASKBOARD_OPENCODE_PUBLIC_URL: ${TASKBOARD_OPENCODE_PUBLIC_URL:-}
      # Remote/LAN deployment always requires first-run admin setup + login cookie.
      TASKBOARD_HOST: 0.0.0.0
      TASKBOARD_PORT: 47824
      TASKBOARD_AUTH_REQUIRED: "1"
      # Optional bearer token for API clients; empty by default (browser login only).
      TASKBOARD_TOKEN: ${TASKBOARD_TOKEN:-}
    extra_hosts:
      # Linux resolves host.docker.internal to the host gateway.
      - "host.docker.internal:host-gateway"
    ports:
      - "47824:47824"
    volumes:
      - taskboard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47824/api/auth/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  taskboard-data:
